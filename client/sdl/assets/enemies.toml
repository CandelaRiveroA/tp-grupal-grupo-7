# --- Fuego del Skull ---------------------------------------------------
# Hoja derivada de 3x3 celdas de 16x16: `fire_skull_sheet.png` sale de
# la llama unica `fire_skull.png` (original intacto), con 9 variantes
# de aleteo. El orden de frames define la animacion. Se dibuja como una
# ViewEntity mas (kind SkullFire): la fuente decide en que celda esta y
# el cliente solo lo anima. La hoja mira a la derecha; `left` usa las
# mismas celdas espejadas para acompanar la direccion del disparo.
[characters.skull_fire]
sheet       = "Cavern/skull/fire_skull_sheet.png"
grid        = [16, 16]
drawn       = [28, 28]
cadence     = { step = 36, frame = 4 }

  [characters.skull_fire.front]
  mirrored = false
    [characters.skull_fire.front.idle]
    loops  = true
    frames = [
      [ [0, 0] ],
      [ [1, 0] ],
      [ [2, 0] ],
      [ [2, 1] ],
      [ [1, 1] ],
      [ [0, 1] ],
      [ [0, 2] ],
      [ [1, 2] ],
      [ [2, 2] ],
    ]
    [characters.skull_fire.front.walk]
    loops  = true
    frames = [
      [ [0, 0] ],
      [ [1, 0] ],
      [ [2, 0] ],
      [ [2, 1] ],
      [ [1, 1] ],
      [ [0, 1] ],
      [ [0, 2] ],
      [ [1, 2] ],
      [ [2, 2] ],
    ]

  [characters.skull_fire.back]
  mirrored = false
    [characters.skull_fire.back.idle]
    loops  = true
    frames = [
      [ [0, 0] ],
      [ [1, 0] ],
      [ [2, 0] ],
      [ [2, 1] ],
      [ [1, 1] ],
      [ [0, 1] ],
      [ [0, 2] ],
      [ [1, 2] ],
      [ [2, 2] ],
