  { anchor = "body", offset_y = 16, layers = [ [0, 14, 1, 1] ] },
  { anchor = "body", offset_y = 20, layers = [ [0, 14, 1, 1] ] },
  # Regadera levantada: a la altura de las manos, no sobre la cabeza
  # (3 posiciones de 16px mas abajo que el primer ajuste).
  { anchor = "top",  offset_y = 56, layers = [ [1, 13, 1, 2] ] },
