# ============================================================
# Escenarios del juego, descritos como DATOS.
#
# El código de dibujo es genérico: lee este archivo y dibuja lo
# que indique, sin saber si algo es una pared, un piso u otro
# elemento. Agregar o cambiar un elemento se hace editando este
# archivo; no hace falta recompilar el cliente.
#
# La grilla de acá es de PRESENTACIÓN (dónde se DIBUJA cada
# cosa). No describe colisiones ni reglas de juego: eso es del
# servidor. Ver client/world/scenes-format.md para el detalle de
# cada campo.
# ============================================================

# --- Tilesets: los recursos gráficos disponibles -----------------------
# Cada uno es una imagen y el tamaño de celda de SU grilla (en píxeles).
[tilesets.farm]
image = "Farm/walls&floors.png"
cell  = [16, 16]

# --- Dormitorio --------------------------------------------------------
# floor_color: fondo (lo que no cubre ningún tile).
# grid: tamaño de la habitación en celdas lógicas (de cellW*scale px).
# scale: escala de dibujo por defecto de los elementos (entera).
[rooms.bedroom]
floor_color = [0, 0, 0, 255]
grid        = [30, 20]
scale       = 2
# Cues audibles mientras esta sala se renderiza: los animales están
# acá HOY; cuando exista el granero, esta lista pasa a su sala.
sounds      = ["chicken_cluck", "cow_moo"]

  # Piso: bloque lógico de 2x2 celdas desde (col 0, fila 27), repetido en
  # mosaico para cubrir el área bajo la pared. Hereda scale = 2.
  [[rooms.bedroom.elements]]
  tileset = "farm"
  region  = [0, 27, 2, 2]
  draw    = { mode = "tile" }
  at      = [0, 2]
  span    = [30, 18]

  # Pared superior: columna de 3 celdas (filas 0,1,2) repetida a lo ancho.
  # scale_x = 2 la alinea con el piso; scale_y = 3 la hace más alta.
  [[rooms.bedroom.elements]]
  tileset = "farm"
  region  = [0, 0, 1, 3]
  draw    = { mode = "horizontal_strip", scale_x = 2, scale_y = 3 }
  at      = [0, 0]
  span    = [30, 2]
