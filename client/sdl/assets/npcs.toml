# NPCs estáticos del cliente. Agregar uno = un bloque [[npcs]].
# El cuerpo vive acá (no en scenes.toml) para que cada NPC sea
# autocontenido; el estilo del popup se comparte por nombre.

[popup_styles.default]
grid           = [9, 3]
portrait       = [0, 0, 3, 3]
text           = [3, 0, 6, 3]
portrait_inset = 6
portrait_offset = [7, 0]
text_inset     = 6
text_size      = 19
text_offset    = [-10, 10]
line_gap       = 0
text_color     = [62, 39, 17, 255]

# Botón de cerrar de los popups de contenedor (el cofre): la X arriba a la
# derecha, FUERA del panel. `size` es el tamaño en pantalla; `inset` =
# [distancia al borde derecho hacia adentro, separación sobre el panel].
[container_close]
sheet = "ui/boton_salir.png"
cell  = [16, 16]
at    = [0, 0]
size  = [32, 32]
inset = [0, 4]

[[npcs]]
id    = "pierre"
room  = "market"
style = "default"
text  = """
¡Bienvenido a mi tienda! Soy Pierre: tengo los mejores (y únicos) precios en semillas y compro tus cultivos y productos de granja.

Usa estos comandos en el chat para comerciar:
        /consultar_catalogo
        /comprar producto cantidad
        /vender producto cantidad"""

  [npcs.body]
  sheet = "Players/NPCs/NPC_Pierre.png"
  cell  = [16, 16]
  at    = [13, 9]
  span  = [1, 2]
  cells = [[0, 0], [0, 1]]

  [npcs.portrait]
  sheet  = "Players/NPCs/PierrePort.png"
  cell   = [16, 16]
  region = [0, 0, 4, 4]

# Marnie, Clint y Robin: mismo patrón que Pierre (cuerpo 1x2 celdas de la hoja
# NPC_<Nombre>.png, retrato 4x4 celdas de <Nombre>Port.png). `at` es la
# posición POR DEFECTO: la real la manda la fuente de estado (servidor) en
# LocalWorldView::npcPlacements; si no manda nada, vale esta.

[[npcs]]
id    = "marnie"
room  = "market"
style = "default"
text  = """
¡Hola, bienvenido al rancho! Soy Marnie: amo a los animales y aquí compro y vendo vacas y gallinas para tu granja.

Usa estos comandos en el chat para comerciar:
        /consultar_catalogo
        /comprar producto cantidad
        /vender producto cantidad"""

  [npcs.body]
  sheet = "Players/NPCs/NPC_Marnie.png"
  cell  = [16, 16]
  at    = [9, 7]
  span  = [1, 2]
  cells = [[0, 0], [0, 1]]

  [npcs.portrait]
  sheet  = "Players/NPCs/MarniePort.png"
  cell   = [16, 16]
  region = [0, 0, 4, 4]

[[npcs]]
id    = "clint"
room  = "market"
style = "default"
text  = """
¡Buenas! Soy Clint, el herrero del pueblo: si traes minerales de la mazmorra, te los compro todos.

Usa estos comandos en el chat para comerciar:
        /consultar_catalogo
        /comprar producto cantidad
        /vender producto cantidad"""

  [npcs.body]
  sheet = "Players/NPCs/NPC_Clint.png"
  cell  = [16, 16]
  at    = [17, 7]
  span  = [1, 2]
  cells = [[0, 0], [0, 1]]

  [npcs.portrait]
  sheet  = "Players/NPCs/ClintPort.png"
  cell   = [16, 16]
  region = [0, 0, 4, 4]

[[npcs]]
id    = "robin"
room  = "market"
style = "default"
text  = """
¡Hola! Soy Robin, la carpintera: fabrico muebles, cofres y decoración para tu casa y granja. ¡Mi catálogo cambia cada día!

Usa estos comandos en el chat para comerciar:
        /consultar_catalogo
        /comprar producto cantidad
        /vender producto cantidad"""

  [npcs.body]
  sheet = "Players/NPCs/NPC_Robin.png"
  cell  = [16, 16]
  at    = [10, 12]
  span  = [1, 2]
  cells = [[0, 0], [0, 1]]

  [npcs.portrait]
  sheet  = "Players/NPCs/RobinPort.png"
  cell   = [16, 16]
  region = [0, 0, 4, 4]

# Popup del centro comunitario: contenido de un edificio del editor. No es
# un NPC de ninguna escena: su `room` ("popup") no coincide con ningún mapa,
# así que nunca se dibuja ni se toca; solo aporta el retrato y el texto que
# abre el click sobre el edificio (overlay.toml: [roles.community_center]).
# El texto y el retrato son PROVISORIOS (a definir).
[[npcs]]
id    = "community_center"
room  = "popup"
style = "default"
text  = """
Centro comunitario: aquí se juntan los vecinos del pueblo.

(Texto provisorio)"""

  [npcs.body]
  sheet = "Players/NPCs/NPC_Robin.png"
  cell  = [16, 16]
  at    = [0, 0]
  span  = [1, 2]
  cells = [[0, 0], [0, 1]]

  [npcs.portrait]
  sheet  = "Players/NPCs/RobinPort.png"
  cell   = [16, 16]
  region = [0, 0, 4, 4]

# Cofre: objeto animado (sin popup) que es un MUEBLE del jugador. Su `id` es
# el contentId del mueble (inventory.toml): al colocarlo en cualquier mapa se
# dibuja con estos cuadros y se abre con un click. `room` apunta a una sala
# que no existe a propósito: no es un NPC parado en ningún mapa, solo la
# definición del objeto (el dibujo y el click los hace el mueble colocado).
# Objeto animado (sin popup). Un click lo abre (cuadros en
# orden) y otro lo cierra (en orden inverso). Solo se anima la tapa (fila 32); la
# mitad de abajo (2, 33) es la del cofre cerrado y queda fija. Posición y ritmo
# son datos.
[[npcs]]
id   = "cofre"
room = "prop"

  # Al abrirse muestra una grilla de slots (la figura del inventario).
  [npcs.container]
  grid = [10, 3]

  [npcs.body]
  sheet       = "Decorations/Craftables.png"
  cell        = [16, 16]
  at          = [19, 12]
  span        = [1, 2]
  frame_ticks = 6
  frames = [
    [[2, 32], [2, 33]],
    [[3, 32], [2, 33]],
    [[4, 32], [2, 33]],
    [[5, 32], [2, 33]],
    [[6, 32], [2, 33]],
    [[7, 32], [2, 33]],
  ]

# Cama: MUEBLE del jugador dibujado por piezas (no es un bloque contiguo de
# la hoja). Su `id` es el contentId del mueble. Mismas celdas que tenía la
# decoración del dormitorio (cabecera, mitad, pie). `room = "prop"`: no es
# un NPC de ningún mapa, solo la definición del objeto.
[[npcs]]
id   = "bed"
room = "prop"

  [npcs.body]
  sheet = "Decorations/Towninterior.png"
  cell  = [16, 16]
  at    = [0, 0]
  span  = [2, 4]
  # 2x4 celdas de 16 px a escala 3 = 3x6 celdas lógicas de 32 px.
  drawn = [96, 192]
  cells = [ [4,10],[5,10],
            [4,11],[5,11],
            [6,12],[7,12],
            [0,10],[1,10] ]

  # La celda que manda la fuente (la del server, donde se acuesta) es 1 a
  # la derecha y 2 arriba de la base del sprite.
  [npcs.furniture]
  anchor = [1, 2]

  # Al dormir, las filas 2-3 (mitad + pie) tapan al jugador; la cabecera
  # queda detrás (la cabeza se ve sobre la almohada).
  [npcs.furniture.enter]
  rows   = [2, 3]
  facing = "right"
