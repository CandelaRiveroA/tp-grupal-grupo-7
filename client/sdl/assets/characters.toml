# ============================================================
# Personajes del juego, descritos como DATOS.
#
# Describe la APARIENCIA de cada criatura sin que el código la conozca: la
# hoja de sprites, el tamaño de celda de esa hoja, el tamaño dibujado, la
# cadencia y las ACCIONES por dirección. Agregar/cambiar una criatura —o
# sumarle una acción— es editar este archivo; no hace falta recompilar.
#
# Lo carga world::CharacterCatalogLoader hacia un world::CharacterCatalog
# (datos puros, sin SDL), y el sdl::Renderer lo consume. Ver
# client/world/characters-format.md para el detalle de cada campo.
# ============================================================

# --- Jugador -----------------------------------------------------------
# sheet:   hoja de sprites (ruta relativa al directorio de assets).
# grid:    tamaño de celda de ESA hoja [ancho, alto] en píxeles (16x16).
# drawn:   tamaño con el que se dibuja el CUERPO en pantalla [ancho, alto].
# cadence: step = ticks por celda (velocidad); frame = ticks por cuadro.
#          Invariante: step == frame * (cuadros de la acción walk).
[characters.player]
sheet   = "Players/main/Character_Base.png"
grid    = [16, 16]
drawn   = [32, 64]
cadence = { step = 24, frame = 12 }

  # Presentación del contenido sostenido sobre la cabeza (pose carry):
  # offset_y = separación entre la cabeza y el ítem; NEGATIVO lo baja y
  # pisa la cabeza (un poquito tapándola). scale = escala del sprite
  # del ítem (2 = el doble de su celda de hoja).
  [characters.player.hold]
  offset_y = -15
  scale    = 1.0

  # Cada dirección: si se dibuja espejada y una subtabla por ACCIÓN
  # (idle, walk, ...). Cada acción: frames (lista de cuadros) + loops, y
  # opcionalmente `frame` (ticks por cuadro) con ritmo PROPIO; si no lo
  # declara, usa cadence.frame de la criatura.
  # Cada cuadro es una lista de CAPAS en orden de dibujo (cuerpo, brazos).
  # Una capa es [col, row, cols, rows]: celda origen + tamaño en celdas.
  # El cuerpo es 1x2 (16x32); los brazos 1x1 (bajos, se anclan abajo) o
  # 1x2 (cuando suben). idle y walk son dos acciones más, sin trato
  # especial en el código.

  # --- Apariencia del jugador ------------------------------------------
  # Índices que manda el server en ServerStatus (8 bytes). Cada capa es
  # una lista de OPCIONES en el mismo orden que el índice; cada opción
  # declara sus celdas por cara como [col, row, cols, rows].
  # `side` cubre izquierda/derecha: se dibuja la misma celda y se espeja.
  # Si una cara no está, esa capa no se dibuja en esa dirección.
  [characters.player.appearance]

    # Piel: recolorea cuerpo+brazos con la fila `skin` de la paleta.
    # La hoja tiene 3 columnas (los tonos testigo) y una fila por tono.
    [characters.player.appearance.skin]
    sheet = "Players/appareance/skinColors..png"
    grid  = [3, 1]
    count = 24

    # Pelo: 32 opciones. Va sobre la cabeza (anchor = head): su offset.y es
    # relativo a la coronilla, así la sigue cuando la cabeza sube/baja.
    [characters.player.appearance.hair]
    sheet  = "Players/appareance/hairstyles.png"
    grid   = [16, 16]
    anchor = "head"
    offset = [0, -4]

      [[characters.player.appearance.hair.option]]
