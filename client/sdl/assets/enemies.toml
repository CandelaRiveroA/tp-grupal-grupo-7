# --- Skull -------------------------------------------------------------
# No tiene damage ni death: solo idle/walk/attack. El idle loopea para
# que se anime SIEMPRE aunque la fuente lo deje quieto, y el walk usa
# los MISMOS 4 frames (la animacion de movimiento es una sola).
# `skull_move.png` (64x16) es la tira de 4 frames que usan idle, walk y
# attack (un solo sprite de Skull, sin frames sueltos).
[characters.skull]
sheet       = "Cavern/skull/skull_move.png"
grid        = [16, 16]
drawn       = [32, 32]
cadence     = { step = 32, frame = 8 }

  [characters.skull.front]
  mirrored = false
    [characters.skull.front.idle]
    loops  = true
    frames = [
      [ [0, 0] ],
      [ [1, 0] ],
      [ [2, 0] ],
      [ [3, 0] ],
    ]
    [characters.skull.front.walk]
    loops  = true
    frames = [
      [ [0, 0] ],
      [ [1, 0] ],
      [ [2, 0] ],
      [ [3, 0] ],
    ]
    [characters.skull.front.attack]
    loops  = false
    frames = [
      [ [0, 0] ],
      [ [1, 0] ],
      [ [2, 0] ],
      [ [3, 0] ],
    ]

  [characters.skull.back]
  mirrored = false
    [characters.skull.back.idle]
    loops  = true
    frames = [
      [ [0, 0] ],
      [ [1, 0] ],
      [ [2, 0] ],
      [ [3, 0] ],
    ]
    [characters.skull.back.walk]
    loops  = true
    frames = [
      [ [0, 0] ],
      [ [1, 0] ],
      [ [2, 0] ],
      [ [3, 0] ],
    ]
    [characters.skull.back.attack]
    loops  = false
    frames = [
      [ [0, 0] ],
      [ [1, 0] ],
      [ [2, 0] ],
      [ [3, 0] ],
