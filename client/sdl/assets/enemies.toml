    frames = [
      [ [0, 0] ],
      [ [1, 0] ],
      [ [2, 0] ],
      [ [2, 1] ],
      [ [1, 1] ],
      [ [0, 1] ],
      [ [0, 2] ],
      [ [1, 2] ],
      [ [2, 2] ],
    ]

  # Izquierda: el fuego tambien mira a la derecha en la hoja; espejarlo
