      [12, 54, 1, 1, 0, 2], [13, 54, 1, 1, 1, 2], [14, 54, 1, 1, 2, 2], [15, 54, 1, 1, 3, 2],
      [13, 55, 1, 1, 1, 3], [14, 55, 1, 1, 2, 3] ] },
  { anchor = "bottom", offset_x = 35, offset_y = -25, cell_span = [4, 4], layers = [
      [17, 52, 1, 1, 1, 0],
      [16, 53, 1, 1, 0, 1], [17, 53, 1, 1, 1, 1], [18, 53, 1, 1, 2, 1], [19, 53, 1, 1, 3, 1],
      [16, 54, 1, 1, 0, 2], [17, 54, 1, 1, 1, 2], [18, 54, 1, 1, 2, 2], [19, 54, 1, 1, 3, 2],
      [17, 55, 1, 1, 1, 3], [18, 55, 1, 1, 2, 3], [19, 55, 1, 1, 3, 3] ] },
  { anchor = "bottom", offset_x = 35, offset_y = -25, cell_span = [4, 4], layers = [
      [21, 52, 1, 1, 1, 0], [22, 52, 1, 1, 2, 0], [23, 52, 1, 1, 3, 0],
