# Texto del HUD: la fuente que usa todo el cliente para dibujar letras
# y el copy/apariencia de los popups (dormir, cambio de día, regalos).
#
# Cambiar lo que dice un texto o sus colores = datos. Otro texto u otra
# fuente futuro = otra entrada, sin tocar el dibujo (sdl::TextRenderer).

# --- La fuente de texto -------------------------------------------------
# file: ruta RELATIVA al directorio de assets (desacoplada de dónde vive
#       el .ttf en el árbol de fuentes).
# size: tamaño por defecto, en puntos.
[font]
file = "fonts/StardewValley.ttf"
size = 26

# Otras caras (fuentes) disponibles por nombre. Cualquier texto puede pedir
# una (p. ej. `font = "pixel_operator"` en notice.toml); sin nombre usa la
# de arriba ("default"). Sumar una fuente = una entrada acá (y el .ttf en
# fonts/, que sale de client/qt/resources/fonts).
[[font.face]]
name = "pixel_operator"
file = "fonts/PixelOperator.ttf"

# --- El prompt del popup -------------------------------------------------
# text_color/hover_color: RGBA. hover es el marrón de las opciones bajo
# el mouse.
# text_size/line_gap: layout del prompt, en px.
# grid: la forma del panel en slots [columnas, filas] (hoy 9x2; un
# panel 9x1 o 3x4 es solo otro dato — bordes y relleno se adaptan
# solos).
# Cada popup tiene su copia en [prompt.copy.<clave>]: text + options
# (pregunta) o button (texto con botón). {0}/{1} se reemplazan por los
# datos que manda la fuente de estado (avance, nombre del jugador).
[prompt]
text_color  = [62, 39, 17, 255]
hover_color = [195, 160, 100, 255]
text_size   = 18
line_gap    = 6
grid        = [9, 2]

[prompt.copy.sleep_question]
text    = "¿Terminamos el día?"
options = ["Sí", "No"]

[prompt.copy.sleep_waiting]
text   = "Esperando al resto de jugadores... ({0}/{1})"
button = "cancel"

[prompt.copy.next_day]
text   = "¿Avanzamos al siguiente día?"
button = "ok"

# --- Regalos ------------------------------------------------------------
# Gift offer: el popup del que da el regalo (click sobre otro jugador,
#   solo con algo transferible en el casillero activo: una herramienta
#   no ofrece).
#   "Sí" manda la intención (Take con la mano) al server.
# Gift waiting: espera del emisor (lo abre el cliente tras ofrecer; hoy
#   el server no manda estado del regalo al emisor, se cierra con el
#   botón).
# Gift received: el popup del receptor (lo abre el cliente con el pedido
#   del server).
#   {0} = nombre del jugador que regala: lo manda el server
#   (characterName) y nunca se escribe a mano en el copy.
#   option_offset_y = cuántos px baja la fila Sí/No respecto de la
#   pregunta (2 acá: la pregunta es larga y quedaban muy juntos).
[prompt.copy.gift_offer]
text    = "¿Queres darle este regalo?"
options = ["Sí", "No"]

[prompt.copy.gift_waiting]
text   = "Esperando la respuesta del jugador..."
button = "cancel"

[prompt.copy.gift_received]
text            = "{0} te quiere hacer un regalo. ¿Lo aceptas?"
options         = ["Sí", "No"]
option_offset_y = 2

# --- El botón de cancelar del popup "Esperando..." ---------------------
# Un 9-slice de cursors.png: las 9 piezas [col, row, cols, rows] (las
# del "Botón de cancelar"), más cómo se dibuja: border = px de cada
# esquina, size = tamaño del botón, margin = desde el borde inferior
# derecho del panel. Con size 64x64 y border 16 cada pieza se dibuja a
# escala 1:1 (el bloque 4x4 de la hoja): sin achatarse. Para achicarlo
# sin distorsión, escala border y size juntos (48/12 = 0.75; 32/8 =
# media escala exacta; 64/16 = 1:1).
[prompt.cancel]
sheet = "ui/cursors.png"
cell  = [16, 16]
top_left     = [12, 16, 1, 1]
top          = [13, 16, 2, 1]
top_right    = [15, 16, 1, 1]
left         = [12, 17, 1, 2]
fill         = [13, 17, 2, 2]
right        = [15, 17, 1, 2]
bottom_left  = [12, 19, 1, 1]
bottom       = [13, 19, 2, 1]
bottom_right = [15, 19, 1, 1]
border = 8
size   = [32, 32]
margin = [8, 8]
anchor = "bottom_right"

# --- El botón OK del popup "¿Avanzamos al siguiente día?" --------------
# Mismo 9-slice y mismos campos que el de cancelar (otra sección = otro
# botón), con las piezas del "Botón OK" de cursors.png; anchor lo deja
# abajo al centro del panel.
[prompt.ok]
sheet = "ui/cursors.png"
cell  = [16, 16]
top_left     = [8, 16, 1, 1]
top          = [9, 16, 2, 1]
top_right    = [11, 16, 1, 1]
left         = [8, 17, 1, 2]
fill         = [9, 17, 2, 2]
right        = [11, 17, 1, 2]
bottom_left  = [8, 19, 1, 1]
bottom       = [9, 19, 2, 1]
bottom_right = [11, 19, 1, 1]
border = 8
size   = [32, 32]
margin = [0, 20]
anchor = "bottom_center"

# --- Nombre bajo los pies del jugador ------------------------------------
# El nombre de PERSONAJE (ViewEntity::displayName, lo llena la fuente de
# estado) centrado debajo de los pies. Lo carga world::NameplateLayout y lo
# dibuja sdl::NameplatePainter, sobre el mundo (sigue a la cámara) pero
# después de la luz nocturna (no se oscurece).
#   font            = cara de [[font.face]] (sin la clave, la default).
#   font_size       = tamaño de letra en px.
#   bold            = true para negrita (opcional; default false).
#   gap             = px entre los pies y la caja del texto.
#   box_height      = alto de la caja donde se centra el texto.
#   day_color       = RGBA antes de night_from_hour.
#   night_color     = RGBA desde night_from_hour (hora del reloj del juego,
#                     que sigue después de medianoche: 24, 25, 26).
[nameplate]
font            = "pixel_operator"
font_size       = 16
bold            = true
gap             = 0
box_height      = 18
day_color       = [0, 0, 0, 255]
night_color     = [255, 255, 255, 255]
night_from_hour = 18
