# ============================================================
# Overlay visual de herramientas sobre el personaje.
#
# Define la APARIENCIA de lo que se dibuja encima del personaje durante
# sus acciones: la herramienta en UseTool (por ItemKind) y el contenido
# sostenido al recoger (genérico, [held.*]). Cada herramienta tiene una
# subtabla por dirección con la hoja, tamaño de celda, ticks por
# cuadro y los frames de la animación. El número de frames y los
# frame_ticks deben coincidir con los de la acción del personaje en
# characters.toml para que la animación quede sincronizada.
#
# Lo carga world::ToolOverlayLoader hacia un world::ToolOverlayCatalog
# (datos puros, sin SDL). El Renderer lo consume: lee entity.activeTool
# / entity.activeContent + entity.facing y dibuja el frame correspondiente
# encima del personaje usando el mismo bodyX/bodyBottom. El servidor
# decide qué herramienta está activa (entity.activeTool); este archivo
# decide cómo se ve.
#
# Celdas relevadas de Tools.png con la herramienta de inspección.
# ============================================================

# --- Ajuste vertical por anclaje ---------------------------------------
# [offset]: píxeles que BAJAN la herramienta según su anclaje, para
# compensar el espacio transparente de la hoja. Cada anclaje se afina por
# separado porque el gap es distinto según dónde se apoya el sprite.
# Claves: top / body / bottom (las mismas del anchor de cada frame).
# Opcional: un anclaje sin entrada usa 0. Subir el valor baja más.
[offset]
top    = 14
body   = 0
bottom = 0

# --- Pico (pickaxe) ----------------------------------------------------
# Cada frame es una tabla uniforme:
#   anchor: dónde se apoya respecto al cuerpo — "top" (encima de la
#           cabeza), "body" (bloque del cuerpo) o "bottom" (a los pies).
#           Opcional, default "top".
#   layers: lista de capas [col, row, cols, rows]. Vacía ([]) = sin
#           herramienta en ese cuadro.
# El número de frames y frame_ticks coinciden con los del use_tool del
# personaje en characters.toml para que la animación quede sincronizada.

# Dirección back: el pico se ve arriba de la cabeza en el primer cuadro
# y desaparece el resto (brazos bajando).
[pickaxe.back]
sheet       = "Players/main/tools/Tools.png"
cell        = [16, 16]
frame_ticks = 6
frames = [
  { anchor = "top", offset_y = -4, layers = [ [3, 5, 1, 2] ] },
  { layers = [] },
  { layers = [] },
  { layers = [] },
  { layers = [] },
]

# Dirección front: el pico recorre 3 alturas mientras baja el golpe.
#   frame 0: arriba de la cabeza (anchor top).
#   frame 1: "bajando", a nivel del cuerpo/torso (anchor body).
#   frame 2: "picando", a los pies (anchor bottom).
#   frames 3-4: sin herramienta.
[pickaxe.front]
sheet       = "Players/main/tools/Tools.png"
cell        = [16, 16]
frame_ticks = 6
frames = [
  { anchor = "top",    offset_x = -8,  offset_y = 6, layers = [ [0, 5, 1, 2] ] },
  { anchor = "body",   layers = [ [3, 5, 1, 2] ] },
  { anchor = "bottom", offset_y = 24, layers = [ [1, 5, 1, 2] ] },
  { layers = [] },
  { layers = [] },
]

# Dirección right: UN solo sprite del pico (derecho) que ROTA siguiendo
# el brazo a lo largo del golpe. angle = grados en sentido horario.
#   frame 0: pico levantado hacia atrás/arriba (ángulo negativo).
#   frame 1: empieza a bajar.
#   frame 2: a nivel del cuerpo.
#   frame 3: golpe abajo-adelante (ángulo positivo).
#   frame 4: sin herramienta.
# Ajustá angle / offset_x / offset_y mirando cómo sigue el brazo.
[pickaxe.right]
sheet       = "Players/main/tools/Tools.png"
cell        = [16, 16]
frame_ticks = 6
# pivot por frame = [x, y] en fracción del sprite (puede exceder 1 para
# agrandar el radio de giro). Cada frame tiene su propio radio: bajá el
# segundo número en los frames de abajo si el arco se va muy lejos.
frames = [
  { anchor = "top",    angle = -25,  offset_x = -8, offset_y = 8, scale = 0.85, pivot = [0.5, 1.25], layers = [ [2, 5, 1, 2] ] },
  { anchor = "top",    angle = 20,  offset_x = -2, offset_y = 6, scale = 0.85, pivot = [0.5, 1.15], layers = [ [2, 5, 1, 2] ] },
  { anchor = "body",   angle = 50, offset_x = 34, offset_y = -8, scale = 0.85, pivot = [0.5, 0.5], layers = [ [2, 5, 1, 2] ] },
  { anchor = "body",   angle = 96, offset_x = 40, offset_y = 8, scale = 0.85, pivot = [0.5, 0.5], layers = [ [2, 5, 1, 2] ] },
]

# Dirección left: ESPEJO de right. Mismas celdas y pivotes/offset_y, pero
# flip = true (espeja el sprite), y angle + offset_x con signo INVERTIDO
# (el espejo invierte el sentido de giro y el lado hacia donde corre).
[pickaxe.left]
sheet       = "Players/main/tools/Tools.png"
cell        = [16, 16]
frame_ticks = 6
frames = [
  { anchor = "top",    flip = true, angle = 25,   offset_x = 8,   offset_y = 8, scale = 0.85, pivot = [0.5, 1.25], layers = [ [2, 5, 1, 2] ] },
  { anchor = "top",    flip = true, angle = -20,  offset_x = 2,   offset_y = 6, scale = 0.85, pivot = [0.5, 1.15], layers = [ [2, 5, 1, 2] ] },
  { anchor = "body",   flip = true, angle = -50, offset_x = -34, offset_y = -8, scale = 0.85, pivot = [0.5, 0.5], layers = [ [2, 5, 1, 2] ] },
  { anchor = "body",   flip = true, angle = -100, offset_x = -34, offset_y = 10, scale = 0.85, pivot = [0.5, 0.5], layers = [ [2, 5, 1, 2] ] },
]

# --- Pala (shovel) ----------------------------------------------------
# Mismo patrón que el pico y misma sincronía con el use_tool del
# personaje (5 cuadros, frame_ticks 6 = 30 ticks por golpe). Las celdas
# son las de la pala en Tools.png (banda de las filas 1-2); los
# offsets/ángulos parten de los del pico y se afinan a ojo.
#
# Dirección front: frame 0 = animación 1 (brazos levantados, sprite 1x2
# en [0,1]); los CUERPOS RESTANTES llevan la animación 2 (sprite 1x1 en
# [1,2]), todos iguales. El sprite 1x1 baja 32px (2 celdas) desde el
# ancla body: a diferencia del pico (1x2, que llega solo), la pala
# tiene que llegar a la altura de los pies del golpe.
[shovel.front]
sheet       = "Players/main/tools/Tools.png"
cell        = [16, 16]
frame_ticks = 6
frames = [
  { anchor = "top",  offset_x = -8, offset_y = 6, layers = [ [0, 1, 1, 2] ] },
  { anchor = "body", offset_y = 32, layers = [ [1, 2, 1, 1] ] },
  { anchor = "body", offset_y = 32, layers = [ [1, 2, 1, 1] ] },
  { anchor = "body", offset_y = 32, layers = [ [1, 2, 1, 1] ] },
  { anchor = "body", offset_y = 32, layers = [ [1, 2, 1, 1] ] },
]

# Dirección back: la pala solo aparece en el PRIMER cuerpo (el que
# levanta los brazos); el resto del golpe se ve sin herramienta.
[shovel.back]
sheet       = "Players/main/tools/Tools.png"
cell        = [16, 16]
frame_ticks = 6
frames = [
  { anchor = "top", offset_y = -4, layers = [ [3, 1, 1, 2] ] },
  { layers = [] },
  { layers = [] },
  { layers = [] },
  { layers = [] },
]

# Direcciones right/left: UN solo sprite (1x2 en [2,1]) que ROTA
# siguiendo el brazo, con la misma convención de ángulo que el pico.
# left es el espejo EXACTO de right (flip = true, angle y offset_x con
# signo invertido).
[shovel.right]
sheet       = "Players/main/tools/Tools.png"
cell        = [16, 16]
frame_ticks = 6
frames = [
  { anchor = "top",    angle = -25, offset_x = -8, offset_y = 8, scale = 0.85, pivot = [0.5, 1.25], layers = [ [2, 1, 1, 2] ] },
  { anchor = "top",    angle = 20,  offset_x = -2, offset_y = 6, scale = 0.85, pivot = [0.5, 1.15], layers = [ [2, 1, 1, 2] ] },
  { anchor = "body",   angle = 50,  offset_x = 34, offset_y = -8, scale = 0.85, pivot = [0.5, 0.5], layers = [ [2, 1, 1, 2] ] },
  { anchor = "body",   angle = 96,  offset_x = 40, offset_y = 8, scale = 0.85, pivot = [0.5, 0.5], layers = [ [2, 1, 1, 2] ] },
]

[shovel.left]
sheet       = "Players/main/tools/Tools.png"
cell        = [16, 16]
frame_ticks = 6
frames = [
  { anchor = "top",    flip = true, angle = 25,   offset_x = 8,   offset_y = 8, scale = 0.85, pivot = [0.5, 1.25], layers = [ [2, 1, 1, 2] ] },
  { anchor = "top",    flip = true, angle = -20,  offset_x = 2,   offset_y = 6, scale = 0.85, pivot = [0.5, 1.15], layers = [ [2, 1, 1, 2] ] },
  { anchor = "body",   flip = true, angle = -50,  offset_x = -34, offset_y = -8, scale = 0.85, pivot = [0.5, 0.5], layers = [ [2, 1, 1, 2] ] },
  { anchor = "body",   flip = true, angle = -100, offset_x = -34, offset_y = 10, scale = 0.85, pivot = [0.5, 0.5], layers = [ [2, 1, 1, 2] ] },
]

# --- Espada (sword, de Weapons.png) -----------------------------------
# La espada se dibuja con UN solo sprite (Weapons.png, celda [0,0]) que
# ROTA siguiendo el brazo, el mismo mecanismo que el pico: angle por
# frame (grados horarios), pivot en la EMPUÑADURA (la esquina inferior
# izquierda del sprite, donde está la empuñadura del arte) y offset por
# frame para mantener la mano en su pose. El arco es una "media U":
# el frame 1 sale IGUAL QUE EL ASSET (angle 0, hoja arriba-derecha) y
# los frames 2-6 barren la hoja de arriba-derecha hacia abajo-izquierda
# por delante del cuerpo. Los números de angle/offset se afinan a ojo
# mirando cómo sigue el brazo (igual que pico y pala).
#
# 6 frames, frame_ticks = 5 = los de la acción "sword" en
# characters.toml (6x5 = 30 ticks, la ventana uniforme del golpe).

# Dirección front: el barrido va por DELANTE del cuerpo (pasada Front).
# El pivot de cada frame es la empuñadura; el ángulo crece ~35° por
# cuadro hasta cerrar la media U (~185°).
[sword.front]
sheet       = "Players/main/tools/Weapons.png"
cell        = [16, 16]
action      = "sword"
frame_ticks = 5
frames = [
  { anchor = "body",   angle = 0,   offset_x = 12, offset_y = 10, pivot = [0.2, 0.85], layers = [ [0, 0, 1, 1] ] },
  { anchor = "body",   angle = 35,  offset_x = 13, offset_y = 13, pivot = [0.2, 0.85], layers = [ [0, 0, 1, 1] ] },
  { anchor = "body",   angle = 75,  offset_x = 13, offset_y = 17, pivot = [0.2, 0.85], layers = [ [0, 0, 1, 1] ] },
  { anchor = "body",   angle = 115, offset_x = 11, offset_y = 19, pivot = [0.2, 0.85], layers = [ [0, 0, 1, 1] ] },
  { anchor = "body",   angle = 150, offset_x = 7,  offset_y = 19, pivot = [0.2, 0.85], layers = [ [0, 0, 1, 1] ] },
  { anchor = "body",   angle = 185, offset_x = 3,  offset_y = 16, pivot = [0.2, 0.85], layers = [ [0, 0, 1, 1] ] },
]

# Dirección back: media U INVERTIDA respecto de frente: la espada arranca
# apuntando arriba-izquierda (angle -90) y barre hacia abajo-derecha
# hasta quedar apuntando abajo (+135), pasando por la corona. Todos los
# frames con behind = true: la espada se dibuja DETRÁS del cuerpo (pasada
# Behind). El cuerpo la tapa donde cruza la espalda y se ve donde
# sobresale (arriba de los hombros en la primera mitad del barrido).
[sword.back]
sheet       = "Players/main/tools/Weapons.png"
cell        = [16, 16]
action      = "sword"
frame_ticks = 5
frames = [
  { anchor = "body",   behind = true, angle = -90,  offset_x = 2,  offset_y = 10, pivot = [0.2, 0.85], layers = [ [0, 0, 1, 1] ] },
  { anchor = "top",    behind = true, angle = -45,  offset_x = 6,  offset_y = 12, pivot = [0.2, 0.85], layers = [ [0, 0, 1, 1] ] },
  { anchor = "top",    behind = true, angle = 0,    offset_x = 11, offset_y = 14, pivot = [0.2, 0.85], layers = [ [0, 0, 1, 1] ] },
  { anchor = "top",    behind = true, angle = 45,   offset_x = 15, offset_y = 12, pivot = [0.2, 0.85], layers = [ [0, 0, 1, 1] ] },
  { anchor = "body",   behind = true, angle = 90,   offset_x = 18, offset_y = 6,  pivot = [0.2, 0.85], layers = [ [0, 0, 1, 1] ] },
  { anchor = "body",   behind = true, angle = 135,  offset_x = 16, offset_y = 12, pivot = [0.2, 0.85], layers = [ [0, 0, 1, 1] ] },
]

# Dirección right: la espada sigue el brazo de costado; el barrido se
# desplaza hacia adelante (offset_x positivo) con el mismo patrón que el
# pico de costado (frames 1-2 arriba, 3-6 bajando hasta cerrar la U).
[sword.right]
sheet       = "Players/main/tools/Weapons.png"
cell        = [16, 16]
action      = "sword"
frame_ticks = 5
frames = [
  { anchor = "top",    angle = -30, offset_x = -4, offset_y = 10, pivot = [0.2, 0.85], layers = [ [0, 0, 1, 1] ] },
  { anchor = "top",    angle = 15,  offset_x = 4,  offset_y = 12, pivot = [0.2, 0.85], layers = [ [0, 0, 1, 1] ] },
  { anchor = "body",   angle = 60,  offset_x = 18, offset_y = 2,  pivot = [0.2, 0.85], layers = [ [0, 0, 1, 1] ] },
  { anchor = "body",   angle = 100, offset_x = 22, offset_y = 12, pivot = [0.2, 0.85], layers = [ [0, 0, 1, 1] ] },
  { anchor = "body",   angle = 140, offset_x = 18, offset_y = 22, pivot = [0.2, 0.85], layers = [ [0, 0, 1, 1] ] },
  { anchor = "body",   angle = 185, offset_x = 10, offset_y = 26, pivot = [0.2, 0.85], layers = [ [0, 0, 1, 1] ] },
]

# Dirección left: ESPEJO de right (flip = true, angle y offset_x con
# signo invertido; el espejo invierte el sentido de giro).
[sword.left]
sheet       = "Players/main/tools/Weapons.png"
cell        = [16, 16]
action      = "sword"
frame_ticks = 5
frames = [
  { anchor = "top",    flip = true, angle = 30,   offset_x = 4,   offset_y = 10, pivot = [0.8, 0.85], layers = [ [0, 0, 1, 1] ] },
  { anchor = "top",    flip = true, angle = -15,  offset_x = -4,  offset_y = 12, pivot = [0.8, 0.85], layers = [ [0, 0, 1, 1] ] },
  { anchor = "body",   flip = true, angle = -60,  offset_x = -18, offset_y = 2,  pivot = [0.8, 0.85], layers = [ [0, 0, 1, 1] ] },
  { anchor = "body",   flip = true, angle = -100, offset_x = -22, offset_y = 12, pivot = [0.8, 0.85], layers = [ [0, 0, 1, 1] ] },
  { anchor = "body",   flip = true, angle = -140, offset_x = -18, offset_y = 22, pivot = [0.8, 0.85], layers = [ [0, 0, 1, 1] ] },
  { anchor = "body",   flip = true, angle = -185, offset_x = -10, offset_y = 26, pivot = [0.8, 0.85], layers = [ [0, 0, 1, 1] ] },
]

# --- Regadera (watering_can) ------------------------------------------
# Sincronizada con la acción "water" (characters.toml): 3 cuadros de
# costado (frame_ticks = 10), 5 de frente (frame_ticks = 6) y 1 de
# espalda (frame_ticks = 30) — los mismos ritmos que la animación para
# que no se desfasen. Los sprites de la regadera son 1x1 (el de frente
# levantado es 1x2). Ajustá angle / offsets mirando cómo sigue el brazo.
# pose 2 de costado = el MISMO sprite de la pose 1, algo más inclinado
# (angle, como el pico).
[watering_can.right]
sheet       = "Players/main/tools/Tools.png"
cell        = [16, 16]
action      = "water"
frame_ticks = 10
frames = [
  { anchor = "bottom", angle = -10, offset_x = 12, offset_y = -6, pivot = [0.5, 1.0], layers = [ [2, 14, 1, 1] ] },
  { anchor = "bottom", angle = -35, offset_x = 14, offset_y = -10, pivot = [0.5, 1.0], layers = [ [2, 14, 1, 1] ] },
  # Verter: la regadera va a la mano extendida (mas cerca en x) y algo
  # menos inclinada que el primer ajuste.
  { anchor = "body",   angle = 28,  offset_x = 18, offset_y = 8,  pivot = [0.5, 0.5], layers = [ [3, 14, 1, 1] ] },
]

# Chorro de agua de COSTADO (derecha): mismo efecto genérico que el de
# frente, pero el agua cae ADELANTE del personaje (offset_x positivo).
# Mismos 7 grupos de Animations.png; frame_ticks = 4 para repartirlos en
# la ventana de "water". cell_span = [4, 4] mete TODO el patrón de cada
# grupo en UNA celda lógica (el tamaño de la celda de tierra): el chorro
# crece en densidad de gotas, no en tamaño. offset_x / offset_y quedan
# CONSTANTES entre frames para que el chorro no se mueva ni se agrande.
[watering_can.right.effect]
sheet       = "Farm/Animations.png"
cell        = [16, 16]
action      = "water"
frame_ticks = 4
frames = [
  { anchor = "bottom", offset_x = 35, offset_y = -25, cell_span = [4, 4], layers = [
