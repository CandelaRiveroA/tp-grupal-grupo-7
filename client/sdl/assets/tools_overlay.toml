# Chorro de agua de FRENTE: efecto GENÉRICO de la herramienta (ver
# convención §10). Es otro overlay animado con su propia hoja
# (Animations.png) que la regadera larga durante la acción "water". Son
# 7 frames que avanzan (grupo 1 pocas gotas → grupo 7 lleno, impactando).
# Puramente visual: cae, impacta y desaparece; no deja tierra mojada.
# Cada celda es [col, row, cols, rows, dx, dy] (dx, dy = offset EN CELDAS
# dentro del patrón). cell_span = [4, 4] mete TODO el patrón en UNA celda
# lógica (el tamaño de la celda de tierra): el chorro crece en densidad
# de gotas, NO en tamaño. offset_x = 0 lo centra bajo el personaje y
# offset_y = 0 lo apoya a los pies: de frente el agua cae recta hacia
# abajo/adelante. Offsets CONSTANTES entre frames (no se mueve ni crece).
[watering_can.front.effect]
sheet       = "Farm/Animations.png"
cell        = [16, 16]
action      = "water"
frame_ticks = 4
frames = [
  # Grupo 1: las primeras gotitas que caen de la regadera.
  { anchor = "bottom", offset_x = 0, offset_y = 0, cell_span = [4, 4], layers = [
      [2, 53, 1, 1, 0, 0], [2, 54, 1, 1, 0, 1] ] },
  # Grupo 2.
  { anchor = "bottom", offset_x = 0, offset_y = 0, cell_span = [4, 4], layers = [
      [6, 53, 1, 1, 1, 0], [5, 54, 1, 1, 0, 1], [6, 54, 1, 1, 1, 1] ] },
  # Grupo 3.
  { anchor = "bottom", offset_x = 0, offset_y = 0, cell_span = [4, 4], layers = [
      [9, 53, 1, 1, 0, 0], [10, 53, 1, 1, 1, 0],
      [9, 54, 1, 1, 0, 1], [10, 54, 1, 1, 1, 1] ] },
  # Grupo 4: el chorro ya es ancho y empieza a tocar abajo.
  { anchor = "bottom", offset_x = 0, offset_y = 0, cell_span = [4, 4], layers = [
      [14, 52, 1, 1, 2, 0],
      [12, 53, 1, 1, 0, 1], [13, 53, 1, 1, 1, 1], [14, 53, 1, 1, 2, 1], [15, 53, 1, 1, 3, 1],
      [12, 54, 1, 1, 0, 2], [13, 54, 1, 1, 1, 2], [14, 54, 1, 1, 2, 2], [15, 54, 1, 1, 3, 2],
      [13, 55, 1, 1, 1, 3], [14, 55, 1, 1, 2, 3] ] },
  # Grupo 5.
  { anchor = "bottom", offset_x = 0, offset_y = 0, cell_span = [4, 4], layers = [
      [17, 52, 1, 1, 1, 0],
      [16, 53, 1, 1, 0, 1], [17, 53, 1, 1, 1, 1], [18, 53, 1, 1, 2, 1], [19, 53, 1, 1, 3, 1],
      [16, 54, 1, 1, 0, 2], [17, 54, 1, 1, 1, 2], [18, 54, 1, 1, 2, 2], [19, 54, 1, 1, 3, 2],
      [17, 55, 1, 1, 1, 3], [18, 55, 1, 1, 2, 3], [19, 55, 1, 1, 3, 3] ] },
  # Grupo 6.
  { anchor = "bottom", offset_x = 0, offset_y = 0, cell_span = [4, 4], layers = [
      [21, 52, 1, 1, 1, 0], [22, 52, 1, 1, 2, 0], [23, 52, 1, 1, 3, 0],
      [20, 53, 1, 1, 0, 1], [21, 53, 1, 1, 1, 1], [22, 53, 1, 1, 2, 1], [23, 53, 1, 1, 3, 1],
      [21, 54, 1, 1, 1, 2], [22, 54, 1, 1, 2, 2], [23, 54, 1, 1, 3, 2],
      [22, 55, 1, 1, 2, 3] ] },
  # Grupo 7: el chorro lleno impactando contra el piso (último cuadro).
  { anchor = "bottom", offset_x = 0, offset_y = 0, cell_span = [4, 4], layers = [
      [25, 52, 1, 1, 1, 0], [26, 52, 1, 1, 2, 0], [27, 52, 1, 1, 3, 0],
      [24, 53, 1, 1, 0, 1], [25, 53, 1, 1, 1, 1], [26, 53, 1, 1, 2, 1], [27, 53, 1, 1, 3, 1],
      [24, 54, 1, 1, 0, 2], [25, 54, 1, 1, 1, 2], [26, 54, 1, 1, 2, 2], [27, 54, 1, 1, 3, 2],
      [24, 55, 1, 1, 0, 3], [25, 55, 1, 1, 1, 3], [26, 55, 1, 1, 2, 3], [27, 55, 1, 1, 3, 3] ] },
]

# Dirección back: la regadera no se ve (el cuerpo la tapa).
[watering_can.back]
sheet       = "Players/main/tools/Tools.png"
cell        = [16, 16]
action      = "water"
frame_ticks = 30
frames = [
  { layers = [] },
]

# --- Contenido sostenido en las manos (acción pickup) -------------------
# El overlay no es solo de herramientas: cada entrada declara con qué
# ACCIÓN se sincroniza (action; default use_tool). Esta es la sección
# GENÉRICA de lo que se sostiene al recoger (la cosecha, el huevo, ...):
# el sprite es el del CONTENIDO que se levanta (el mismo del inventario,
# resuelto por contentId), no una hoja fija. Por eso es común a todos
# los contenidos: una cosecha nueva no agrega datos acá. Se dibuja
# durante el pickup, subiendo POR DELANTE del personaje (según mire
# izq o der) desde las manos hasta la altura de la cabeza, con la misma
# geometría que tenía el huevo (sprite de 18 px: scale 0.5625 de la
# celda de 32 px).
# Un frame con `drawn = false` no se dibuja (el mismo truco que los
# frames sin layers = [] de las herramientas).
# 4 frames = 4 cuadros del pickup en characters.toml; frame_ticks igual
# que los de esa acción (sin `frame` = cadence.frame = 12) para que la
# animación y el overlay no se desfasen.
[held.right]
action      = "pickup"
frame_ticks = 12
frames = [
  { anchor = "bottom", offset_x = 15, offset_y = -5,  scale = 0.5625 },
  { anchor = "bottom", offset_x = 17, offset_y = -25, scale = 0.5625 },
  { anchor = "body",   offset_x = 19, offset_y = 17,  scale = 0.5625 },
  { anchor = "body",   offset_x = 19, offset_y = -9,  scale = 0.5625 },
]

# Dirección left: espejo EXACTO de right. El offset_x se mide desde el
# borde izquierdo del cuerpo, así que espejar no es negar: la fórmula es
# izquierda = anchoCuerpo - anchoSprite - derecha (32 - 18 - der). Con el
# cuerpo de 32 px y el sprite de 18 px eso da 14 - der. (Negar sirve
# solo cuando la capa ocupa todo el ancho, como las del pico.) Afinar a
# ojo como siempre.
[held.left]
action      = "pickup"
frame_ticks = 12
frames = [
  { anchor = "bottom", offset_x = -1, offset_y = -5,  scale = 0.5625 },
  { anchor = "bottom", offset_x = -3, offset_y = -25, scale = 0.5625 },
  { anchor = "body",   offset_x = -5, offset_y = 17,  scale = 0.5625 },
  { anchor = "body",   offset_x = -5, offset_y = -9,  scale = 0.5625 },
]

# Dirección front (mirando a cámara): el mismo recorrido vertical que el
# de costado pero centrado al frente del cuerpo (el sprite de 18 px en el
# cuerpo de 32 px => offset_x = 7). Sin flip ni espejo: se mira de
# frente.
[held.front]
action      = "pickup"
frame_ticks = 12
frames = [
  { anchor = "bottom", offset_x = 7, offset_y = -5,  scale = 0.5625 },
  { anchor = "bottom", offset_x = 7, offset_y = -25, scale = 0.5625 },
  { anchor = "body",   offset_x = 7, offset_y = 17,  scale = 0.5625 },
  { anchor = "body",   offset_x = 7, offset_y = -9,  scale = 0.5625 },
]

# Dirección back (de espaldas): el contenido solo se ve en el último
# cuadro, con los brazos arriba (los frames con drawn = false no dibujan
# nada, el mismo truco que la herramienta de espaldas). Centrado a la
# altura de la cabeza, como el frame final de costado.
[held.back]
action      = "pickup"
frame_ticks = 12
frames = [
  { drawn = false },
  { drawn = false },
  { drawn = false },
  { anchor = "body", offset_x = 7, offset_y = -9, scale = 0.5625 },
]
