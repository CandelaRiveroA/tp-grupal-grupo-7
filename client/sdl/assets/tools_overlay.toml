      [9, 53, 1, 1, 0, 0], [10, 53, 1, 1, 1, 0],
      [9, 54, 1, 1, 0, 1], [10, 54, 1, 1, 1, 1] ] },
  { anchor = "bottom", offset_x = 35, offset_y = -25, cell_span = [4, 4], layers = [
