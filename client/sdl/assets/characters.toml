    loops  = true
    frames = [
      [ [1, 0, 1, 2], [7, 1, 1, 1] ],
      [ [2, 0, 1, 2], [8, 1, 1, 1] ],
    ]
    # Picar de frente: 5 cuadros, one-shot (loops=false). Brazos 1x2.
    # frame = 6: ritmo propio (5x6 = 30 ticks ≈ 500 ms), igual que
    # left/right para que la duración del golpe sea uniforme en todas
    # las direcciones. Sin `frame` usaría cadence.frame.
    [characters.player.front.use_tool]
    loops  = false
    frame  = 6
    frames = [
      [ [0, 22, 1, 2], [6, 22, 1, 2] ],
      [ [1, 22, 1, 2], [7, 22, 1, 2] ],
      [ [2, 22, 1, 2], [8, 22, 1, 2] ],
      [ [3, 22, 1, 2], [9, 22, 1, 2] ],
      [ [4, 22, 1, 2], [10, 22, 1, 2] ],
    ]
    # Regar de frente: 5 cuadros, one-shot (los brazos suben de 1x1 a
    # 1x2 y vuelven). frame = 6: 5x6 = 30 ticks, la misma duración que
    # costado (3x10) y espalda (1x30) — la ventana del golpe se arma de
    # estos mismos datos y no puede desfasarse (contrato §10). Los
    # brazos de la pose 5 son 1x1 "del torso para arriba": se declaran
    # [6,8,1,2] para que el arte quede en la mitad de arriba (la celda
    # de abajo del par es transparente en la hoja).
    [characters.player.front.water]
    loops  = false
    frame  = 6
    frames = [
      [ [4, 8, 1, 2], [10, 9, 1, 1] ],
      [ [3, 8, 1, 2], [9, 9, 1, 1] ],
      [ [2, 8, 1, 2], [8, 8, 1, 2] ],
      [ [1, 8, 1, 2], [7, 8, 1, 2] ],
      [ [0, 8, 1, 2], [6, 8, 1, 2] ],
    ]
    # Recoger de frente: 4 poses one-shot, brazos subiendo de 1x1 a 1x2
    # (mismo patrón que el de costado). El huevo lo dibuja el overlay
    # [egg.front] (tools_overlay.toml), centrado al frente del cuerpo.
    [characters.player.front.pickup]
    loops  = false
    frames = [
      [ [0, 18, 1, 2], [6, 19, 1, 1] ],
      [ [1, 18, 1, 2], [7, 19, 1, 1] ],
      [ [2, 18, 1, 2], [8, 18, 1, 2] ],
      [ [3, 18, 1, 2], [9, 18, 1, 2] ],
    ]
    # Ordeñar de frente: 2 poses que alternan (loops), brazos 1x1.
    [characters.player.front.milk]
    loops  = true
    frames = [
      [ [4, 8, 1, 2], [10, 9, 1, 1] ],
      [ [3, 8, 1, 2], [9, 9, 1, 1] ],
    ]
    # Sostener de frente (pose estática, 1 cuadro): cuerpo idle +
    # brazos arriba 1x2 (celdas [12,0]). El contenido sostenido se
    # dibuja sobre la cabeza con el mecanismo genérico de held item
    # (no por herramienta). loops = false: la pose se mantiene.
    [characters.player.front.carry]
    loops  = false
    frames = [
      [ [0, 0, 1, 2], [12, 0, 1, 2] ],
    ]
    # Caminar sosteniendo: las piernas de walk (mismos cuadros, mismo
    # ritmo) con los brazos de carry encima. loops = true cicla las
    # piernas; el paso sigue la cadencia de caminata.
    [characters.player.front.carry_walk]
    loops  = true
    frames = [
      [ [1, 0, 1, 2], [12, 0, 1, 2] ],
      [ [2, 0, 1, 2], [12, 0, 1, 2] ],
    ]
    # Desmayo de frente: 3 poses one-shot (parado -> de rodillas -> tirado
    # en el piso) y se queda en la última. frame = 10: la caída dura 30
    # ticks; recién ahí aparece el diálogo de las Z (PlaySession usa la
    # misma cuenta de datos para el aviso). Solo existe de frente: la
    # presentación local fuerza facing = Front.
    [characters.player.front.faint]
    loops  = false
    frame  = 10
    frames = [
      [ [4, 4, 1, 2], [10, 5, 1, 1] ],
      [ [4, 0, 1, 2], [10, 1, 1, 1] ],
      [ [5, 0, 1, 2], [11, 1, 1, 1] ],
    ]

  # Espaldas (caminar hacia arriba) — RELEVADA. Brazos 1x2 (suben).
  [characters.player.back]
  mirrored = false
    [characters.player.back.idle]
    loops  = false
    frames = [ [ [0, 4, 1, 2], [6, 4, 1, 2] ] ]
    [characters.player.back.walk]
    loops  = true
    frames = [
      [ [1, 4, 1, 2], [7, 4, 1, 2] ],
      [ [2, 4, 1, 2], [8, 4, 1, 2] ],
    ]
    # Picar de espaldas: 5 cuadros, one-shot (loops=false). Cuerpo
    # (cols 0-4) y brazos (cols 6-10) en la fila 12; los brazos son
    # 1x2 porque las piezas cruzan el borde fila 12/13 (verificado con
    # grilla sobre la hoja). Mismo ritmo que el resto de las
    # direcciones (frame = 6 => 5x6 = 30 ticks): el golpe es uniforme.
    [characters.player.back.use_tool]
    loops  = false
    frame  = 6
    frames = [
      [ [0, 12, 1, 2], [6, 12, 1, 2] ],
      [ [1, 12, 1, 2], [7, 12, 1, 2] ],
      [ [3, 62, 1, 2], [9, 63, 1, 1] ],
      [ [2, 62, 1, 2], [8, 63, 1, 1] ],
      [ [4, 62, 1, 2], [10, 62, 1, 2] ],
    ]
    # Regar de espalda: 1 pose estática (brazos 1x2). frame = 30: el
    # cuadro dura lo mismo que la animación completa de las otras
    # direcciones (30 ticks), para que la duración sea uniforme.
    [characters.player.back.water]
    loops  = false
    frame  = 30
    frames = [
      [ [4, 56, 1, 2], [16, 56, 1, 2] ],
    ]
    # Ordeñar de espaldas: 2 poses que alternan (loops), brazos 1x1 en
    # ambas (a diferencia del de costado, cuyo frame 2 es 1x2).
    [characters.player.back.milk]
    loops  = true
    frames = [
      [ [2, 20, 1, 2], [8, 21, 1, 1] ],
      [ [3, 20, 1, 2], [9, 21, 1, 1] ],
    ]
    # Recoger de espaldas: 4 poses one-shot, brazos subiendo de 1x1 a
    # 1x2. El huevo lo dibuja [egg.back] solo en el último cuadro.
    [characters.player.back.pickup]
    loops  = false
    frames = [
      [ [2, 20, 1, 2], [8, 21, 1, 1] ],
      [ [3, 20, 1, 2], [9, 21, 1, 1] ],
      [ [4, 20, 1, 2], [10, 20, 1, 2] ],
      [ [5, 20, 1, 2], [11, 20, 1, 2] ],
    ]
    # Sostener de espaldas (pose estática): cuerpo idle + brazos arriba
    # 1x2 (celdas [17,6]). El contenido sostenido va sobre la cabeza.
    [characters.player.back.carry]
    loops  = false
    frames = [
      [ [0, 4, 1, 2], [17, 6, 1, 2] ],
    ]
    # Caminar sosteniendo: piernas de walk + brazos de carry.
    [characters.player.back.carry_walk]
    loops  = true
    frames = [
      [ [1, 4, 1, 2], [17, 6, 1, 2] ],
      [ [2, 4, 1, 2], [17, 6, 1, 2] ],
    ]

  # Izquierda — RELEVADA (mismas celdas que derecha, espejada).
  [characters.player.left]
  mirrored = true
    [characters.player.left.idle]
    loops  = false
    frames = [ [ [0, 2, 1, 2], [6, 3, 1, 1] ] ]
    [characters.player.left.walk]
    loops  = true
    frames = [
      [ [1, 2, 1, 2], [7, 3, 1, 1] ],
      [ [2, 2, 1, 2], [8, 3, 1, 1] ],
    ]
    # Picar espejado (mismas celdas que derecha, mirrored=true las voltea).
    # frame = 6: ritmo PROPIO de esta acción (ticks por cuadro), más ágil
    # que la caminata (cadence.frame = 12). Sin `frame` usaría ese default.
    [characters.player.left.use_tool]
    loops  = false
    frame  = 6
    frames = [
      [ [0, 16, 1, 2], [6, 16, 1, 2] ],
      [ [1, 16, 1, 2], [7, 16, 1, 2] ],
      [ [2, 16, 1, 2], [8, 16, 1, 2] ],
      [ [3, 16, 1, 2], [9, 16, 1, 2] ],
      [ [4, 16, 1, 2], [10, 16, 1, 2] ],
    ]
    # Regar espejado (mismas celdas que derecha, mirrored=true las
    # voltea): 3 cuadros one-shot. frame = 10: 3x10 = 30 ticks, la
    # misma duración que las otras direcciones (contrato §10).
    [characters.player.left.water]
    loops  = false
    frame  = 10
    frames = [
      [ [4, 18, 1, 2], [10, 19, 1, 1] ],
      [ [5, 18, 1, 2], [11, 19, 1, 1] ],
      [ [3, 14, 1, 2], [15, 14, 1, 2] ],
    ]
    # Ordeñar: dos poses que alternan (cuerpo 1x2 + brazos), espejadas
    # igual que picar. loops = true = la alternancia 1-2-1-2; cuántas
    # vueltas da lo decide la fuente de estado (la duración de la
    # acción), no estos datos.
    [characters.player.left.milk]
    loops  = true
    frames = [
      [ [4, 18, 1, 2], [10, 19, 1, 1] ],
      [ [5, 18, 1, 2], [11, 18, 1, 2] ],
    ]
    # Recoger (el huevo del piso): 4 poses one-shot, brazos subiendo de
    # 1x1 a 1x2. El huevo en las manos lo dibuja el overlay
    # (tools_overlay.toml [egg.*]), sincronizado con estos cuadros.
    [characters.player.left.pickup]
    loops  = false
    frames = [
      [ [4, 60, 1, 2], [10, 61, 1, 1] ],
      [ [5, 60, 1, 2], [11, 61, 1, 1] ],
      [ [0, 62, 1, 2], [6, 62, 1, 2] ],
      [ [1, 62, 1, 2], [7, 62, 1, 2] ],
    ]
    # Sostener de costado (pose estática, espejada): cuerpo idle +
    # brazos arriba 1x2 (celdas [12,2]).
    [characters.player.left.carry]
    loops  = false
    frames = [
      [ [0, 2, 1, 2], [12, 2, 1, 2] ],
    ]
    # Caminar sosteniendo (espejado): piernas de walk + brazos de carry.
    [characters.player.left.carry_walk]
    loops  = true
    frames = [
      [ [1, 2, 1, 2], [12, 2, 1, 2] ],
      [ [2, 2, 1, 2], [12, 2, 1, 2] ],
    ]

  # Derecha — RELEVADA. Brazos 1x1 (bajos, se anclan abajo).
  [characters.player.right]
  mirrored = false
    [characters.player.right.idle]
    loops  = false
    frames = [ [ [0, 2, 1, 2], [6, 3, 1, 1] ] ]
    [characters.player.right.walk]
    loops  = true
    frames = [
      [ [1, 2, 1, 2], [7, 3, 1, 1] ],
      [ [2, 2, 1, 2], [8, 3, 1, 1] ],
    ]
    # Picar: 5 cuadros, one-shot (loops=false). Brazos 1x2 (levantados).
    # Al terminar, el estado de juego vuelve a idle (lo maneja el mock).
    # frame = 6: ritmo PROPIO (5x6 = 30 ticks ≈ 500 ms), más ágil que
    # cadence.frame (12, el de caminar). Sin `frame` usaría ese default.
    [characters.player.right.use_tool]
    loops  = false
    frame  = 6
    frames = [
      [ [0, 16, 1, 2], [6, 16, 1, 2] ],
      [ [1, 16, 1, 2], [7, 16, 1, 2] ],
      [ [2, 16, 1, 2], [8, 16, 1, 2] ],
      [ [3, 16, 1, 2], [9, 16, 1, 2] ],
      [ [4, 16, 1, 2], [10, 16, 1, 2] ],
    ]
    # Regar de costado: 3 cuadros one-shot (brazos 1x1 bajos y el final
    # con brazos 1x2, el de verter). frame = 10: 3x10 = 30 ticks, la
    # misma duración que las otras direcciones (contrato §10).
    [characters.player.right.water]
    loops  = false
    frame  = 10
    frames = [
      [ [4, 18, 1, 2], [10, 19, 1, 1] ],
      [ [5, 18, 1, 2], [11, 19, 1, 1] ],
      [ [3, 14, 1, 2], [15, 14, 1, 2] ],
    ]
    # Ordeñar: mismas celdas que left (con mirrored=true las voltea).
    # Dos poses que alternan; cuántas vueltas da lo decide la fuente.
    [characters.player.right.milk]
    loops  = true
    frames = [
      [ [4, 18, 1, 2], [10, 19, 1, 1] ],
      [ [5, 18, 1, 2], [11, 18, 1, 2] ],
    ]
    # Recoger: mismas celdas que left (espejado). 4 poses one-shot.
    [characters.player.right.pickup]
    loops  = false
    frames = [
      [ [4, 60, 1, 2], [10, 61, 1, 1] ],
      [ [5, 60, 1, 2], [11, 61, 1, 1] ],
      [ [0, 62, 1, 2], [6, 62, 1, 2] ],
      [ [1, 62, 1, 2], [7, 62, 1, 2] ],
    ]
    # Sostener de costado (pose estática): cuerpo idle + brazos arriba
    # 1x2 (celdas [12,2]).
    [characters.player.right.carry]
    loops  = false
    frames = [
      [ [0, 2, 1, 2], [12, 2, 1, 2] ],
    ]
    # Caminar sosteniendo: piernas de walk + brazos de carry.
    [characters.player.right.carry_walk]
    loops  = true
    frames = [
      [ [1, 2, 1, 2], [12, 2, 1, 2] ],
      [ [2, 2, 1, 2], [12, 2, 1, 2] ],
    ]

# --- Gallina -----------------------------------------------------------
# Relevada con taller_tile_inspector sobre Farm/Chicken.png (64x112 px,
# celdas de 16x16 => 4 columnas x 7 filas). Fila 0: caminata de frente
# (4 cuadros, cols 0-3). Fila 1: caminata de derecha. Fila 2: de espaldas.
# Fila 3: de izquierda (la hoja trae izquierda explícita: NO se espeja).
# Fila 4: descanso — parada de frente (0,4), sentada de frente (1,4),
# parada de lado derecho (2,4), sentada de lado derecho (3,4). Fila 5:
# parada de espaldas (0,5), sentada de espaldas (1,5), parada de lado
# izquierdo (2,5), sentada de lado izquierdo (3,5). Fila 6: picoteando
# de frente, 4 cuadros (cols 0-3), disponible para una acción futura.
#
# idle = pose "parada" de cada dirección (capa única 1x1). La variante
# "sentada" queda relevada para un idle más rico (dato, sin código).
# cadence: walk son 4 cuadros => invariante step == frame * 4
# (32 == 8 * 4). Cada capa es 1x1: el cuerpo entero es un cuadro.
[characters.chicken]
sheet   = "Farm/Chicken.png"
grid    = [16, 16]
drawn   = [32, 32]
cadence = { step = 32, frame = 8 }

  [characters.chicken.front]
  mirrored = false
    [characters.chicken.front.idle]
    loops  = false
    frames = [ [ [0, 4] ] ]
    [characters.chicken.front.walk]
    loops  = true
    frames = [ [ [0, 0] ], [ [1, 0] ], [ [2, 0] ], [ [3, 0] ] ]

  [characters.chicken.right]
  mirrored = false
    [characters.chicken.right.idle]
    loops  = false
    frames = [ [ [2, 4] ] ]
    [characters.chicken.right.walk]
    loops  = true
    frames = [ [ [0, 1] ], [ [1, 1] ], [ [2, 1] ], [ [3, 1] ] ]

  [characters.chicken.back]
  mirrored = false
    [characters.chicken.back.idle]
    loops  = false
    frames = [ [ [0, 5] ] ]
    [characters.chicken.back.walk]
    loops  = true
    frames = [ [ [0, 2] ], [ [1, 2] ], [ [2, 2] ], [ [3, 2] ] ]

  [characters.chicken.left]
  mirrored = false
    [characters.chicken.left.idle]
    loops  = false
    frames = [ [ [2, 5] ] ]
    [characters.chicken.left.walk]
    loops  = true
    frames = [ [ [0, 3] ], [ [1, 3] ], [ [2, 3] ], [ [3, 3] ] ]

# --- Vaca ---------------------------------------------------------------
# Relevada con taller_tile_inspector sobre Farm/Female_Cow_Brown.png
# (128x96 px, celdas de 32x32 => 4 columnas x 3 filas: cada sprite es
# 2x2 celdas de 16, el doble de grande que la gallina). Fila 0:
# caminata de IZQUIERDA (4 cuadros; la hoja no trae derecha:
# mirrored=true la voltea). Fila 1: caminata de frente. Fila 2: de
# espaldas. Sin poses de descanso en la hoja: el idle reusa el primer
# cuadro del walk de cada dirección (dato, sin código). cadence: walk
# son 4 cuadros => invariante step == frame * 4 (48 == 12 * 4); paso
# más pesado que el de la gallina.
[characters.cow]
sheet   = "Farm/Female_Cow_Brown.png"
grid    = [32, 32]
drawn   = [64, 64]
cadence = { step = 48, frame = 12 }

  [characters.cow.front]
  mirrored = false
    [characters.cow.front.idle]
    loops  = false
    frames = [ [ [0, 1] ] ]
    [characters.cow.front.walk]
    loops  = true
    frames = [ [ [0, 1] ], [ [1, 1] ], [ [2, 1] ], [ [3, 1] ] ]

  [characters.cow.back]
  mirrored = false
    [characters.cow.back.idle]
    loops  = false
    frames = [ [ [0, 2] ] ]
    [characters.cow.back.walk]
    loops  = true
    frames = [ [ [0, 2] ], [ [1, 2] ], [ [2, 2] ], [ [3, 2] ] ]

  [characters.cow.left]
  mirrored = false
    [characters.cow.left.idle]
    loops  = false
    frames = [ [ [0, 0] ] ]
    [characters.cow.left.walk]
    loops  = true
    frames = [ [ [0, 0] ], [ [1, 0] ], [ [2, 0] ], [ [3, 0] ] ]

  [characters.cow.right]
  mirrored = true
    [characters.cow.right.idle]
    loops  = false
    frames = [ [ [0, 0] ] ]
    [characters.cow.right.walk]
    loops  = true
    frames = [ [ [0, 0] ], [ [1, 0] ], [ [2, 0] ], [ [3, 0] ] ]
